<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>RAHMAT 云南清真餐厅</title>

  <style>
    /* Logo 图片样式 */
.logo {
  width: 200px;
  max-width: 100%;
  height: auto;
  margin-bottom: 30px;border-radius: 18px;
  transition: transform 0.3s;
}
.logo:hover {
  transform: scale(1.05);
}
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #14532d;
    }

    p {
      color: #444444;
    }
    .card {
  background-color: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}
    button {
  transition: transform 0.3s;
  background-color: #14532d;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  margin: 6px;
}
button:hover {
  transform: scale(1.05);
}
  </style>
</head>
<body>
<div class="card">
<img src="images/logo.jpg" alt="RAHMAT Logo" class="logo"> 
    <h1>RAHMAT</h1>
<p id="message">云南清真料理 · Yunnan Muslim Cuisine</p>
<button title="点击展开或收起餐厅介绍" onclick="
  const message = document.getElementById('message');
  if (this.textContent === '了解更多') {
    message.textContent = '欢迎来到 RAHMAT！我们主打云南清真美食，Batu Kawan 新店敬请期待。';
    this.textContent = '收起介绍';
  } else {
    message.textContent = '云南清真料理 · Yunnan Muslim Cuisine';
    this.textContent = '了解更多';
  }
">了解更多</button><button onclick="window.open('images/yunnan-rice.png', '_blank')">
  查看菜品
</button>
<p style="font-size: 12px; color: #666;">
  图片为 AI 生成的菜品示意图，实际出品以店内为准。
</p>
<!-- 餐厅地址区域 -->
<h2>餐厅地址</h2>
<p>
  G-15 至 G-17, JALAN BOREALIS 6<br>
  PUSAT KOMERSIAL BOREALIS<br>
  14110 BANDAR CASSIA
</p><button onclick="window.open('https://www.google.com/maps/search/?api=1&query=G-15+Jalan+Borealis+6+Pusat+Komersial+Borealis+14110+Bandar+Cassia', '_blank')">
  查看地图
</button>
<!-- 营业时间区域 -->
<h2>营业时间</h2>
<p>新店筹备中，开业日期与营业时间即将公布。</p>
<!-- 页脚区域 -->
<footer style="margin-top: 24px; font-size: 12px; color: #666;">
  © 2026 RAHMAT 云南清真餐厅
</footer>
  </div>
</body>
</html>
